<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>AYOWA · phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Karla:wght@400;500&display=swap">
<style>
/* Layout: one column on the phone. Status at the top, setup in the middle, two big hold buttons at the bottom. */
:root {
  --void: #0e0d12;
  --ink: #ece8f2;
  --muted: #8c8799;
  --line: #2c2935;
  --panel: #18161f;
  --accent: #e6c9a8;
  --me: #e6c9a8;
  --display: "Syncopate", "Helvetica Neue", Arial, sans-serif;
  --body: "Karla", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--void); color: var(--ink); font: 16px/1.4 var(--body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
main {
  box-sizing: border-box; min-height: 100%;
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 16px;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 480px; margin: 0 auto;
}
header { padding-inline-end: 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font: 700 18px/1 var(--display); letter-spacing: 0.3em; }
#me { width: 22px; height: 22px; border-radius: 50%; background: var(--me); box-shadow: 0 0 16px var(--me); flex: none; }
#status { color: var(--muted); font-size: 14px; }
.card { align-content: start; display: grid; gap: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type="text"] {
  flex: 1; min-width: 0; font: 700 20px var(--display); letter-spacing: 0.2em; text-transform: uppercase;
  background: var(--void); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
button {
  font: 500 15px var(--body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 11px 18px; cursor: pointer; touch-action: manipulation;
}
button.primary { background: var(--accent); color: #1c1610; border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.seg button { border-color: transparent; background: transparent; padding: 8px 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--void); }
label.slider { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
label.slider input { width: 100%; accent-color: var(--accent); }
.help { color: var(--muted); font-size: 14px; }
#pad {
  border: 1px dashed var(--line); border-radius: 16px; min-height: 160px;
  display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; padding: 12px;
  touch-action: none;
}
.hold { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hold button {
  border-radius: 22px; padding: 0; height: 120px; font: 700 15px/1 var(--display); letter-spacing: 0.15em;
  touch-action: none; border-width: 2px;
}
.hold button.on { background: var(--me); color: #1c1610; border-color: var(--me); }
#pullHold { border-style: dashed; }
</style>

<main>
  <header>
    <h1>AYOWA</h1>
    <div id="me" aria-hidden="true"></div>
  </header>
  <div id="status" role="status"></div>

  <section class="card" id="setup">
    <div class="row" id="joinRow">
      <input id="room" type="text" maxlength="8" autocomplete="off" inputmode="text">
      <button id="joinBtn" class="primary" type="button"></button>
    </div>
    <div class="row">
      <div class="seg" role="group">
        <button id="tiltBtn" type="button" aria-pressed="true"></button>
        <button id="padBtn" type="button" aria-pressed="false"></button>
      </div>
      <button id="calBtn" type="button"></button>
    </div>
    <label class="slider"><span id="sensLabel"></span><input id="sens" type="range" min="0.5" max="3" step="0.1" value="1.2"></label>
    <div class="help" id="help"></div>
    <div id="pad" hidden></div>
  </section>

  <div class="hold">
    <button id="pushHold" type="button"></button>
    <button id="pullHold" type="button"></button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/*
  AYOWA phone: your phone becomes a cursor on the AYOWA screen.

  - TILT: point the phone at the screen like a laser pointer (hold it like a TV remote).
    The position comes from the phone's orientation, relative to a "centre" you calibrate.
    A One Euro filter smooths the signal without much delay.
  - TOUCHPAD: slide your finger on the pad to move the cursor (no motion sensor needed).
  - Hold PUSH to dent or bulge the clay, hold PULL to grab and stretch it.
  - The phone sends {t:'m', x, y, p} about 60 times a second: x and y from 0 to 1, p = 0 hover, 1 push, 2 pull.
*/

const LANG = new URLSearchParams(location.search).get('lang') === 'fr' ? 'fr' : 'en';
const TEXT = {
  en: {
    join: 'Join', code: 'CODE', tilt: 'Tilt', pad: 'Touchpad', calibrate: 'Re-centre', sens: 'Sensitivity',
    push: 'PUSH', pull: 'PULL',
    waiting: 'Type the code shown on the screen.', connecting: 'Connecting…',
    connected: 'Connected. You are this color on the screen.', lost: 'Connection lost. Reconnecting…',
    notFound: 'No screen with this code yet. Trying again…',
    helpTilt: 'Hold the phone like a remote, top edge toward the screen. Aim at the centre of the screen and tap Re-centre.',
    helpPad: 'Slide your finger on the pad to move your cursor.',
    padText: 'Slide here to move', noSensor: 'Motion sensor not available: switched to Touchpad.'
  },
  fr: {
    join: 'Rejoindre', code: 'CODE', tilt: 'Inclinaison', pad: 'Pavé tactile', calibrate: 'Recentrer', sens: 'Sensibilité',
    push: 'POUSSER', pull: 'TIRER',
    waiting: 'Tape le code affiché sur l’écran.', connecting: 'Connexion…',
    connected: 'Connecté·e. Tu as cette couleur sur l’écran.', lost: 'Connexion perdue. Reconnexion…',
    notFound: 'Aucun écran avec ce code pour l’instant. Nouvel essai…',
    helpTilt: 'Tiens le téléphone comme une télécommande, le haut vers l’écran. Vise le centre de l’écran et touche Recentrer.',
    helpPad: 'Fais glisser ton doigt sur le pavé pour déplacer ton curseur.',
    padText: 'Glisse ici pour bouger', noSensor: 'Capteur de mouvement indisponible : passage au pavé tactile.'
  }
}[LANG];

const PEER_PREFIX = 'ayowa-clay-screen-';
const $ = id => document.getElementById(id);

/* ---------- State ---------- */
let x = 0.5, y = 0.5;     // cursor position sent to the screen (0..1)
let press = 0;            // 0 hover, 1 push, 2 pull
let mode = 'tilt';
let sens = 1.2;
let ref = null;           // calibrated centre {a, b}
let raw = null;           // latest orientation {a, b}
let gotSensor = false;
let peer = null, conn = null;

/* ---------- One Euro filter (smooths jitter, stays responsive when moving fast) ---------- */
function OneEuro(minCutoff = 1.2, beta = 0.02, dCutoff = 1) {
  let xPrev = null, dxPrev = 0, tPrev = 0;
  const alpha = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
  return (v, t) => {
    if (xPrev === null) { xPrev = v; tPrev = t; return v; }
    const dt = Math.max(1e-3, (t - tPrev) / 1000); tPrev = t;
    const dx = (v - xPrev) / dt;
    const edx = dxPrev + alpha(dCutoff, dt) * (dx - dxPrev); dxPrev = edx;
    const cutoff = minCutoff + beta * Math.abs(edx);
    xPrev = xPrev + alpha(cutoff, dt) * (v - xPrev);
    return xPrev;
  };
}
const fx = OneEuro(), fy = OneEuro();

// difference between two angles, always between -180 and 180 (handles the 0/360 jump)
const wrap = d => ((d + 540) % 360) - 180;

/* ---------- Tilt: phone orientation -> cursor ---------- */
function onOrientation(e) {
  if (e.alpha == null || e.beta == null) return;
  gotSensor = true;
  raw = { a: e.alpha, b: e.beta };
  if (!ref) ref = { ...raw };
  if (mode !== 'tilt') return;
  const range = 50 / sens;                     // degrees to sweep the whole screen
  const t = performance.now();
  const nx = 0.5 - wrap(raw.a - ref.a) / range; // turn left -> cursor left
  const ny = 0.5 - (raw.b - ref.b) / range;     // tilt the top edge up -> cursor up
  x = Math.max(0, Math.min(1, fx(nx, t)));
  y = Math.max(0, Math.min(1, fy(ny, t)));
}

async function startSensor() {
  try {
    // iPhone asks for permission, and only after a tap
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') throw new Error('denied');
    }
    window.addEventListener('deviceorientation', onOrientation);
    setTimeout(() => { if (!gotSensor && mode === 'tilt') { setMode('pad'); say(TEXT.noSensor); } }, 1500);
  } catch (e) { setMode('pad'); say(TEXT.noSensor); }
}

function recentre() { if (raw) ref = { ...raw }; x = 0.5; y = 0.5; }

/* ---------- Touchpad ---------- */
function bindPad() {
  const pad = $('pad');
  let last = null;
  pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); last = [e.clientX, e.clientY]; });
  pad.addEventListener('pointermove', e => {
    if (!last) return;
    const k = 0.0025 * sens;
    x = Math.max(0, Math.min(1, x + (e.clientX - last[0]) * k));
    y = Math.max(0, Math.min(1, y + (e.clientY - last[1]) * k));
    last = [e.clientX, e.clientY];
  });
  const end = () => { last = null; };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
}

/* ---------- Hold buttons ---------- */
function bindHold(btn, value) {
  const on = e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); press = value; btn.classList.add('on'); if (navigator.vibrate) navigator.vibrate(12); };
  const off = () => { if (press === value) press = 0; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- Connection ---------- */
function say(t) { $('status').textContent = t; }

// if the screen changes (the first screen left), join again by itself
let retryTimer = null;
function retry() { clearTimeout(retryTimer); retryTimer = setTimeout(join, 2500); }

function join() {
  clearTimeout(retryTimer);
  const code = $('room').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  if (!code) { say(TEXT.waiting); return; }
  if (typeof Peer === 'undefined') { say(TEXT.lost); return; }
  history.replaceState(null, '', location.pathname + location.search + '#' + code);
  if (peer) { try { peer.destroy(); } catch (e) { /* ignore */ } }
  say(TEXT.connecting);
  if (mode === 'tilt' && !gotSensor) startSensor();
  peer = new Peer({ debug: 0 });
  peer.on('open', () => {
    conn = peer.connect(PEER_PREFIX + code);
    conn.on('open', () => { say(TEXT.connected); recentre(); });
    conn.on('data', msg => {
      if (msg && msg.t === 'color' && /^#[0-9a-f]{6}$/i.test(msg.color)) document.documentElement.style.setProperty('--me', msg.color);
    });
    conn.on('close', () => { say(TEXT.lost); retry(); });
    conn.on('error', () => { say(TEXT.lost); retry(); });
  });
  peer.on('error', err => { say(err && err.type === 'peer-unavailable' ? TEXT.notFound : TEXT.lost); retry(); });
}

// send about 60 times a second, and at least every 300 ms so the screen knows we are here
let lastMsg = '', lastSend = 0;
setInterval(() => {
  if (!conn || !conn.open) return;
  const msg = { t: 'm', x: Math.round(x * 10000) / 10000, y: Math.round(y * 10000) / 10000, p: press };
  const text = JSON.stringify(msg), now = performance.now();
  if (text === lastMsg && now - lastSend < 300) return;
  conn.send(msg); lastMsg = text; lastSend = now;
}, 16);

/* ---------- Mode and interface ---------- */
function setMode(m) {
  mode = m;
  $('tiltBtn').setAttribute('aria-pressed', String(m === 'tilt'));
  $('padBtn').setAttribute('aria-pressed', String(m === 'pad'));
  $('pad').hidden = m !== 'pad';
  $('calBtn').hidden = m !== 'tilt';
  $('help').textContent = m === 'tilt' ? TEXT.helpTilt : TEXT.helpPad;
}

document.documentElement.lang = LANG;
$('room').placeholder = TEXT.code;
$('room').value = (location.hash || '').slice(1).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
$('joinBtn').textContent = TEXT.join;
$('tiltBtn').textContent = TEXT.tilt;
$('padBtn').textContent = TEXT.pad;
$('calBtn').textContent = TEXT.calibrate;
$('sensLabel').textContent = TEXT.sens;
$('pad').textContent = TEXT.padText;
$('pushHold').textContent = TEXT.push;
$('pullHold').textContent = TEXT.pull;
$('joinBtn').addEventListener('click', join);
$('tiltBtn').addEventListener('click', () => { setMode('tilt'); if (!gotSensor) startSensor(); recentre(); });
$('padBtn').addEventListener('click', () => setMode('pad'));
$('calBtn').addEventListener('click', recentre);
$('sens').addEventListener('input', e => { sens = +e.target.value; });
bindPad();
bindHold($('pushHold'), 1);
bindHold($('pullHold'), 2);
setMode('tilt');
say(TEXT.waiting);
</script>

</body></html>
